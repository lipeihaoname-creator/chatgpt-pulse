name: Check and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    name: macOS universal candidate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm test:browser
      - run: ./scripts/build.sh --target universal-apple-darwin --bundles app,dmg
        env:
          CI: 'true'
      - run: ditto -c -k --keepParent 'src-tauri/target/universal-apple-darwin/release/bundle/macos/ChatGPT Pulse.app' ChatGPT-Pulse-mac-universal.zip
      - uses: actions/upload-artifact@v7
        with:
          name: mac-universal-candidate
          path: |
            ChatGPT-Pulse-mac-universal.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-check-results
          path: test-results/
  windows:
    name: Windows x64 compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm tauri build --no-bundle
